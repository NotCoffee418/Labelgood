<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#e5392b"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flap" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ea"/>
    </linearGradient>
    <filter id="labelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#7a1608" flood-opacity="0.4"/>
    </filter>
    <filter id="flapShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="-4" stdDeviation="5" flood-color="#7a1608" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)"/>

  <!-- Sticker label on its backing sheet, bottom-right corner peeling up -->
  <g transform="rotate(-8 256 256)">
    <rect filter="url(#labelShadow)" x="96" y="126" width="320" height="260" rx="40" fill="#ffe680"/>
    <path fill="#ffffff"
          d="M150 150H362Q392 150 392 180V298L328 362H150Q120 362 120 332V180Q120 150 150 150Z"/>

    <!-- Printed content -->
    <rect x="156" y="190" width="156" height="34" rx="17" fill="#1f2937"/>
    <rect x="156" y="246" width="196" height="20" rx="10" fill="#cbd5e1"/>
    <rect x="156" y="284" width="124" height="20" rx="10" fill="#cbd5e1"/>

    <!-- Folded corner -->
    <path filter="url(#flapShadow)" fill="url(#flap)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"
          d="M392 298L328 362Q326 322 336 306Q350 296 392 298Z"/>
  </g>
</svg>
